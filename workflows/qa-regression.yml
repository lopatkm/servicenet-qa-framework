name: QA Regression Tests (Nightly)

on:
  schedule:
    - cron: '0 6 * * *'   # 6:00 AM UTC daily — 2:00 AM ET
  workflow_dispatch:

jobs:
  regression:
    runs-on: [self-hosted, test-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore dependencies
        run: dotnet restore
      - name: Build solution
        run: dotnet build --no-restore --configuration Release
      - name: Install Playwright browsers
        run: pwsh tests/YourApp.Tests.E2E/bin/Release/net10.0/playwright.ps1 install chromium
      - name: Run regression suite
        env:
          E2E_BASE_URL: https://testdirectordashboard.servicenet.org
          E2E_AUTH_PATH: ${{ secrets.E2E_AUTH_JSON_PATH }}
          E2E_HEADLESS: "true"
          DIRECTOR_DASHBOARD_TEST_CONNSTR: ${{ secrets.INTEGRATION_TEST_CONNSTR }}
        run: |
          dotnet test --filter "Category=Regression" \
            --configuration Release \
            --logger "trx;LogFileName=regression-results.trx" \
            --logger "console;verbosity=normal"
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Regression Test Results
          path: "**/*.trx"
          reporter: dotnet-trx
      - name: Upload test artifacts on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: regression-failure-artifacts
          path: |
            **/*.trx
            **/*.png
          retention-days: 7
